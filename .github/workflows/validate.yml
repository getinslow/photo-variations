name: Validate skill bundle

on:
  push:
    paths:
      - 'skills/**'
      - '.github/workflows/validate.yml'
  pull_request:
    paths:
      - 'skills/**'
      - '.github/workflows/validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Check upstream hashes and route behavior
        run: python -B skills/photo-variations/scripts/validate_bundle.py
